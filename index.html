<main class="app">


    <!-- ======================================

    <section id="startScreen">

</main>

    );

const result =

const againButton =
    document.getElementById(
        "againButton"
    );

const errorMessage =
    document.getElementById(
        "errorMessage"
    );


// ==========================================================
// コンパス
// ==========================================================

function throwCompass() {

    startScreen.style.display =
        "none";

    result.style.display =
        "none";

    againButton.style.display =
        "none";

    errorMessage.style.display =
        "none";

    movieScreen.style.display =
        "block";


    movie.pause();

    movie.currentTime = 0;


    const playPromise =
        movie.play();


    if (
        playPromise !== undefined
    ) {

        playPromise.catch(

            function () {

                movieScreen.style.display =
                    "none";

                errorMessage.innerHTML =
                    "アネゴ「むむっ……" +
                    "固有演出が再生できないぞ！」";

                errorMessage.style.display =
                    "block";

                againButton.style.display =
                    "inline-block";

            }

        );

    }

}


// ==========================================================
// 動画終了
// ==========================================================

movie.addEventListener(

    "ended",

    function () {

        movieScreen.style.display =
            "none";

        showResult();

    }

);


// ==========================================================
// 結果
// ==========================================================

function showResult() {

    const isSpecial = Math.random() < SPECIAL_CHANCE;

    const destination = isSpecial
        ? "✨ SPECIAL JOURNEY ✨ 🇭🇰 香港・沙田へ黄金の旅路を辿りに行く 🏇"
        : places[Math.floor(Math.random() * places.length)];


    const rating =

        Math.floor(
            Math.random() * 5
        ) + 1;


    const stars =

        "★".repeat(
            rating
        )

        +

        "☆".repeat(
            5 - rating
        );


    document.getElementById(
        "destination"
    ).textContent =
        destination;


    document.getElementById(
        "stars"
    ).textContent =
        stars;


    document.getElementById(
        "anegoMessage"
    ).innerHTML = isSpecial
        ? 'アネゴ「……来たな、アナタ。<br>これは特別だ。香港へ黄金の旅路を辿りに行こう！」'
        : messages[rating];


    result.style.display =
        "block";


    againButton.style.display =
        "inline-block";

}
